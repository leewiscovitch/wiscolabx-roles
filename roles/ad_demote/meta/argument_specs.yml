---
argument_specs:
  main:
    short_description: Demote a controller to a member server of its domain
    description:
      - Removes AD DS from this controller (Uninstall-ADDSDomainController), reboots and waits until the machine
        reports itself a member server of the same domain. A machine that is no controller is left alone. The AD DS
        feature stays installed.
      - Not for a domain's last controller, nor for a holder of an operation master (FSMO) role; move the roles first.
    options:
      ad_demote_domain_admin_user:
        type: str
        required: true
        description: A member of the domain's Domain Admins, as user@domain (admin@example.test).
      ad_demote_domain_admin_password:
        type: str
        required: true
        no_log: true
        description: That user's password.
      ad_demote_local_admin_password:
        type: str
        required: true
        no_log: true
        description:
          - The password the local Administrator gets back once the machine is no controller. At least 8 characters,
            from three of upper case, lower case, digits and other characters.
      ad_demote_reboot_timeout:
        type: int
        default: 900
        description: Seconds to wait for the reboot and for the machine to report itself a member server.
