---
# Required, no default (meta/argument_specs.yml): ad_demote_domain_admin_user, ad_demote_domain_admin_password,
# ad_demote_local_admin_password.
# How long to wait, in seconds, for the machine to come back after the demotion's reboot and to report itself a
# member server. A demotion takes about two minutes with its reboot; a failed login after the reboot only shows when
# this runs out.
ad_demote_reboot_timeout: 900
# Seconds between shutdown.exe /r and the reboot, when the role reboots the machine itself (a demotion that worked
# and a module that failed after it, tasks/reboot.yml): long enough for the command to return over the session.
ad_demote_reboot_delay: 5
