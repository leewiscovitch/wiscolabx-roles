---
argument_specs:
  main:
    short_description: A further controller of an existing domain, with its DNS
    description:
      - Installs AD DS and DNS with their management tools, promotes the machine into an existing domain
        (Install-ADDSDomainController, a writable global catalog), reboots and waits until the directory answers and
        SYSVOL is replicated in. A machine that is a controller already is left alone.
      - The machine must find the domain through its DNS client before it starts.
    options:
      ad_controller_domain:
        type: str
        required: true
        description: The DNS name of the domain to join as a controller (example.test).
      ad_controller_domain_admin_user:
        type: str
        required: true
        description: A member of the domain's Domain Admins, as user@domain (admin@example.test).
      ad_controller_domain_admin_password:
        type: str
        required: true
        no_log: true
        description: That user's password.
      ad_controller_safe_mode_password:
        type: str
        required: true
        no_log: true
        description:
          - The Directory Services Restore Mode password of this controller. At least 8 characters, from three of
            upper case, lower case, digits and other characters.
      ad_controller_ready_timeout:
        type: int
        default: 1800
        description: Seconds to wait for the reboot and for the directory to be ready.
