---
# A controller's time (README.md). The domain's time flows from the PDC emulator down: it alone looks outside, every
# other controller and member follows the domain (NT5DS). The machine's role is read here, so the same role runs on
# every controller and does the right thing when the PDC emulator moves.
- name: The NTP server list is not empty
  ansible.builtin.assert:
    that: ad_time_ntp_servers | length > 0
    fail_msg: ad_time_ntp_servers is empty; give at least one NTP server
    quiet: true

- name: The time service's source
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param ([string[]]$Servers)
      # Check mode runs this with -WhatIf, and the DNS cmdlets (CIM based) then read nothing: every change below is
      # guarded by $Ansible.CheckMode instead
      $WhatIfPreference = $false
      $Ansible.Changed = $false
      $role = [int](Get-CimInstance Win32_ComputerSystem).DomainRole
      $p = Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Parameters
      $announce = (Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Config).AnnounceFlags
      # 0x8: ask in client mode (what an NTP server such as a router expects). AnnounceFlags 5: always a time
      # server and a reliable one; 10 (the default): a time server, reliable only if the domain says so
      switch ($role) {
          5 { $want = @{ type = 'NTP'; peers = ($Servers | ForEach-Object { "$_,0x8" }) -join ' '; announce = 5 }
              $config = @("/manualpeerlist:$($want.peers)", '/syncfromflags:manual', '/reliable:yes') }
          4 { $want = @{ type = 'NT5DS'; peers = $null; announce = 10 }
              $config = @('/syncfromflags:domhier', '/reliable:no') }
          default {
              if ($Ansible.CheckMode) { $Ansible.Changed = $true; "DomainRole $role, no controller yet: would set the time once it is"; return }
              throw "DomainRole ${role}: not a domain controller (4 or 5)"
          }
      }
      $ok = $p.Type -eq $want.type -and $announce -eq $want.announce -and ($null -eq $want.peers -or $p.NtpServer -eq $want.peers)
      if ($ok) { return }
      $Ansible.Changed = $true
      "DomainRole ${role}: Type $($p.Type) -> $($want.type), NtpServer '$($p.NtpServer)'" +
          $(if ($want.peers) { " -> '$($want.peers)'" } else { '' }) + ", AnnounceFlags $announce -> $($want.announce)"
      if ($Ansible.CheckMode) { return }
      w32tm /config @config /update | Out-Null
      if ($LASTEXITCODE) { throw "w32tm /config failed ($LASTEXITCODE)" }
      w32tm /resync /rediscover /nowait | Out-Null
    parameters:
      Servers: "{{ ad_time_ntp_servers }}"
  register: ad_time_result

- name: What changed (or would)
  ansible.builtin.debug:
    msg: "{{ ad_time_result.output }}"
  when: ad_time_result.output | length > 0   # the script prints a line only when it changes
